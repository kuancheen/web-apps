name: Update Project Data

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Star List Data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Query to get all lists and their items, including README content for hits.sh extraction
          QUERY='query($login: String!) {
            user(login: $login) {
              lists(first: 20) {
                nodes {
                  name
                  items(first: 100) {
                    nodes {
                      ... on Repository {
                        name
                        owner { login }
                        description
                        homepageUrl
                        url
                        stargazerCount
                        primaryLanguage { name color }
                        readme: object(expression: "HEAD:README.md") {
                          ... on Blob {
                            text
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }'
          
          # Fetch the data using gh cli
          DATA=$(gh api graphql -f query="$QUERY" -F login='kuancheen')
          
          # Get current timestamp in ISO 8601 format
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Process the data:
          # 1. Filter the specific list named "web-apps"
          # 2. Extract hits.sh URL from README text using jq match
          # 3. Clean up the object by removing the raw readme text to keep data.json small
          echo "$DATA" | jq --arg timestamp "$TIMESTAMP" '{
            lastUpdated: $timestamp,
            repositories: [.data.user.lists.nodes[] | select(.name | contains("web-apps")) .items.nodes[] | 
              . + {hitsUrl: (try (.readme.text | capture("(?<url>https://hits\\.sh/[^\\\"\\) \\n]+)") | .url) catch null)} |
              del(.readme)
            ]
          }' > data.json

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update project data from GitHub Stars" && git push)

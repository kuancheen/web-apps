name: Update Project Data

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Star List Data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Query to get all lists and their items, including README for title extraction
          QUERY='query($login: String!) {
            user(login: $login) {
              lists(first: 20) {
                nodes {
                  name
                  items(first: 100) {
                    nodes {
                      ... on Repository {
                        name
                        owner { login }
                        description
                        homepageUrl
                        url
                        stargazerCount
                        primaryLanguage { name color }
                        readme: object(expression: "HEAD:README.md") {
                          ... on Blob {
                            text
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }'
          
          # Fetch the data using gh cli
          DATA=$(gh api graphql -f query="$QUERY" -F login='kuancheen')
          
          # Get current timestamp in ISO 8601 format
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Filter the specific list named "web-apps" and extract friendlyName from README
          echo "$DATA" | jq --arg timestamp "$TIMESTAMP" '{
            lastUpdated: $timestamp,
            repositories: [.data.user.lists.nodes[] | select(.name | contains("web-apps")) .items.nodes[] |
              . + {friendlyName: (try (.readme.text | split("\n") | map(select(startswith("# "))) | .[0] | sub("^# "; "") | sub(" \\([^\\)]+\\)$"; "") | sub(" [^\\w]*$"; "")) catch null)} |
              del(.readme)
            ]
          }' > data.json

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          # Only commit if data.json has changed
          if ! git diff --quiet --staged; then
            git commit -m "Update project data from GitHub Stars"
            git push
            
            # Trigger the Pages Deployment workflow manually to ensure the site rebuilds
            echo "Data updated. Triggering deployment..."
            gh workflow run "Deploy to GitHub Pages" --ref main
          else
            echo "No changes to data.json"
          fi
